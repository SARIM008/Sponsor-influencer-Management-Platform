{% extends 'layout.html' %}

{% block title %}Update Campaign{% endblock %}

{% block content %}
    {% include 'navbar_sponsor.html' %}
    <div style="padding: 20px; max-width: 900px; margin: 0 auto;">
        <h1 style="text-align: center; color: #333; font-size: 2rem;">Update Campaign</h1>
        <form method="POST" action="{{ url_for('update_campaign', campaign_id=campaign.id) }}" style="background: #f9f9f9; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            <div style="margin-bottom: 20px;">
                <label for="name" style="display: block; font-weight: bold; color: #555;">Campaign Name:</label>
                <input type="text" id="name" name="name" value="{{ campaign.name }}" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="des" style="display: block; font-weight: bold; color: #555;">Description:</label>
                <textarea id="des" name="des" rows="5" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">{{ campaign.des }}</textarea>
            </div>
            <div style="margin-bottom: 20px;">
                <label for="category" style="display: block; font-weight: bold; color: #555;">Category:</label>
                <input type="text" id="category" name="category" value="{{ campaign.category }}" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="budget" style="display: block; font-weight: bold; color: #555;">Budget:</label>
                <input type="number" id="budget" name="budget" value="{{ campaign.budget }}" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="status" style="display: block; font-weight: bold; color: #555;">Status:</label>
                <select id="status" name="status" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">
                    <option value="" disabled>Select Status</option>
                    <option value="pending" {% if campaign.status == 'pending' %}selected{% endif %}>pending</option>
                    <option value="active" {% if campaign.status == 'active' %}selected{% endif %}>active</option>
                </select>
            </div>
            <div style="margin-bottom: 20px;">
                <label for="s_date" style="display: block; font-weight: bold; color: #555;">Start Date:</label>
                <input type="date" id="s_date" name="s_date" value="{{ campaign.s_date.strftime('%Y-%m-%d') }}" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="e_date" style="display: block; font-weight: bold; color: #555;">End Date:</label>
                <input type="date" id="e_date" name="e_date" value="{{ campaign.e_date.strftime('%Y-%m-%d') }}" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="goal" style="display: block; font-weight: bold; color: #555;">Goal:</label>
                <input type="text" id="goal" name="goal" value="{{ campaign.goal }}" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="products" style="display: block; font-weight: bold; color: #555;">Products:</label>
                <input type="text" id="products" name="products" value="{{ campaign.products }}" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">
            </div>
            <div style="margin-bottom: 20px;">
                <label for="visibility" style="display: block; font-weight: bold; color: #555;">Visibility:</label>
                <select id="visibility" name="visibility" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;">
                    <option value="" disabled selected>Select Visibility</option>
                    <option value="public" {% if campaign.visibility == 'public' %}selected{% endif %}>Public</option>
                    <option value="private" {% if campaign.visibility == 'private' %}selected{% endif %}>Private</option>
                </select>
            </div>
            <button type="submit" style="
                background-color: #007bff;
                color: #fff;
                padding: 14px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
                width: 100%;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                transition: background-color 0.3s ease;
            ">Update Campaign</button>
        </form>
    </div>
{% endblock %}
