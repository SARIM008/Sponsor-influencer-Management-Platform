{% extends 'layout.html' %}

{% block title %}User Login{% endblock %}

{% block content %}
<div class="login-container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 10px;">
        <h2 class="card-title text-center mb-4">User Login</h2>
        <form action="/login.html" method="POST">
            <!-- Role Dropdown -->
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select id="role" name="role" class="form-select" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="influencer">Influencer</option>
                    <option value="sponsor">Sponsor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            
            <div class="form-floating mb-3">
                <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
                <label for="username">Username</label>
            </div>
           
            <div class="form-floating mb-4">
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
           
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg">Login</button>
            </div>
        </form>
        
        <div class="mt-3 text-center">
            <a href="influencer_registration.html" class="btn btn-outline-secondary">Influencer Registration</a>
            <a href="sponsor_registration.html" class="btn btn-outline-secondary">Sponsor Registration</a>
        </div>
    </div>
</div>
{% endblock %}
